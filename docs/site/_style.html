<style>
/* Layout: a lab notebook — narrow reading column, one wide structure bench. Accent = iodine violet. */
:root{
  --bg:#f6f6f8; --panel:#ffffff; --ink:#1d2230; --muted:#5b6274; --line:#dcdfe7;
  --accent:#6a3fa3; --accent-soft:#efe8f8; --lead:#575d6b;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#b0302b; --bad-bg:#f9e2e0; --idle:#5b6274; --idle-bg:#eceef3;
  --viewer:#ffffff;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151c; --panel:#1b1e27; --ink:#e6e8ef; --muted:#9aa1b2; --line:#2d313d;
  --accent:#b996ea; --accent-soft:#2a2238; --lead:#a3a9b6;
  --ok:#6fd3a0; --ok-bg:#16301f; --warn:#f0c062; --warn-bg:#33280f; --bad:#f08a84; --bad-bg:#3a1a19; --idle:#9aa1b2; --idle-bg:#252833;
  --viewer:#0f1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151c; --panel:#1b1e27; --ink:#e6e8ef; --muted:#9aa1b2; --line:#2d313d;
  --accent:#b996ea; --accent-soft:#2a2238; --lead:#a3a9b6;
  --ok:#6fd3a0; --ok-bg:#16301f; --warn:#f0c062; --warn-bg:#33280f; --bad:#f08a84; --bad-bg:#3a1a19; --idle:#9aa1b2; --idle-bg:#252833;
  --viewer:#0f1117; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:40px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1}
h2{font-size:24px;line-height:1.2}
h3{font-size:17px;font-family:var(--body);font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header{display:grid;gap:12px}
.lede{color:var(--muted);font-size:16px}
section{display:grid;gap:16px;min-width:0}
.pill{display:inline-block;font:500 12px/1 var(--mono);padding:5px 8px;border-radius:4px;white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)} .warn{color:var(--warn);background:var(--warn-bg)}
.bad{color:var(--bad);background:var(--bad-bg)} .idle{color:var(--idle);background:var(--idle-bg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 12px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
code,.mono{font-family:var(--mono);font-size:13px}
/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 11px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tabs button:focus-visible,.ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viewer{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--viewer);overflow:hidden}
.viewer .fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl button{font:500 12px var(--mono);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer}
.ctl button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.side{display:grid;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px;min-width:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.caption{font-size:14px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:12.5px/1.5 var(--mono)}
ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:72ch}
.note{font-size:13px;color:var(--muted)}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.status{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
.status b{font-weight:600;font-size:14px}
.status .d{grid-column:2;font-size:13px;color:var(--muted)}
</style>
